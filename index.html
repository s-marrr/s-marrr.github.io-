<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#050505"><title>Silent Camera Pro</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}*{box-sizing:border-box}body{margin:0;background:#050505;color:white;overscroll-behavior:none}.app{max-width:600px;height:100dvh;min-height:500px;margin:auto;display:flex;flex-direction:column;background:#000}.top{display:flex;align-items:center;justify-content:space-around;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 10px 12px;z-index:1;background:#0b0b0b}button{border:0;cursor:pointer;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #ffd23f;outline-offset:3px}.tool{background:#29292d;border-radius:99px;min-width:44px;min-height:40px;padding:0 10px;font-size:13px;font-weight:650}.tool.active{color:#ffd23f}.view{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;background:#111}.frame{width:100%;height:100%;position:relative;overflow:hidden;background:#171717}.frame video,.frame canvas{width:100%;height:100%;object-fit:cover;display:block}.frame video{transform:scale(var(--zoom,1));filter:var(--filter,none)}.grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33.25%,#ffffff50 33.33%,transparent 33.5%,transparent 66.55%,#ffffff50 66.66%,transparent 66.8%),linear-gradient(0deg,transparent 33.25%,#ffffff50 33.33%,transparent 33.5%,transparent 66.55%,#ffffff50 66.66%,transparent 66.8%)}.hidden{display:none!important}.countdown{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:200;text-shadow:0 2px 20px #000}.toast{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#000b;padding:10px 16px;border-radius:22px;font-size:13px;text-align:center;max-width:90%;white-space:normal;pointer-events:none}.lower{background:#090909;padding:14px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}.sliderrow{display:flex;align-items:center;gap:12px;justify-content:center}.sliderrow label{font-size:13px;min-width:40px;color:#ffd23f;font-weight:bold}.sliderrow input{width:min(65%,290px);accent-color:#ffd23f}.presets{display:flex;align-items:center;justify-content:center;gap:10px}.chip{background:#242428;color:#eee;padding:8px 12px;border-radius:20px;font-size:12px;white-space:nowrap}.chip.selected{color:#ffd23f;background:#3c3522}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;justify-items:center;min-height:90px}.shutter{height:75px;width:75px;border-radius:50%;background:white;border:5px solid #0a0a0a;outline:3px solid white;transition:transform .13s}.shutter:active{transform:scale(.93)}.round{width:50px;height:50px;background:#252525;border-radius:50%;font-size:23px;display:grid;place-items:center}.last{height:48px;width:48px;object-fit:cover;border-radius:8px;border:1px solid #555;background:#222}.status{text-align:center;color:#aaa;font-size:11px;line-height:1.4}.filterbar{overflow-x:auto;display:flex;gap:8px;scrollbar-width:none;padding:0 2px}.filterbar::-webkit-scrollbar{display:none}.filterbar button{flex:0 0 auto}.error{padding:20px;text-align:center;line-height:1.8;color:#eee}.dialog{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:20;padding:20px}.modal{background:#202024;border-radius:18px;padding:20px;max-width:420px;line-height:1.7}.modal button{background:#ffd23f;color:#171717;border-radius:12px;padding:11px 18px;font-weight:700;margin-top:8px}@media(max-height:690px){.top{padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:5px}.lower{gap:8px;padding-top:8px}.actions{min-height:75px}.shutter{width:62px;height:62px}.status{font-size:10px}}
</style></head>
<body><main class="app"><header class="top"><button class="tool" id="gridBtn" aria-label="グリッド">▦</button><button class="tool" id="ratioBtn" aria-label="撮影比率">4:3</button><button class="tool" id="timerBtn" aria-label="セルフタイマー">◷ OFF</button><button class="tool" id="helpBtn" aria-label="使い方">ⓘ</button></header>
<section class="view"><div class="frame" id="frame"><video id="video" autoplay muted playsinline webkit-playsinline></video><div id="grid" class="grid hidden"></div><div id="countdown" class="countdown hidden"></div></div><div id="toast" class="toast">「カメラを開始」を押してください</div></section>
<section class="lower"><div class="sliderrow"><label id="zoomText" for="zoom">1.0×</label><input id="zoom" type="range" min="1" max="3" value="1" step="0.1" aria-label="ズーム"></div><nav class="filterbar" id="filters" aria-label="フィルター"><button class="chip selected" data-filter="normal">標準</button><button class="chip" data-filter="vivid">鮮やか</button><button class="chip" data-filter="mono">モノクロ</button><button class="chip" data-filter="warm">暖色</button><button class="chip" data-filter="cool">寒色</button><button class="chip" data-filter="retro">レトロ</button></nav><div class="actions"><div id="previewSlot"><button id="startBtn" class="round" aria-label="カメラを開始">▶</button></div><button id="shutter" class="shutter" aria-label="写真を撮影" disabled></button><button id="flipBtn" class="round" aria-label="前面と背面のカメラを切り替える">⟳</button></div><div class="status">撮影画像は端末内で処理・保存されます。ページから外部送信しません。<br>端末・OSが強制するシャッター音は消せません。</div></section></main>
<div id="dialog" class="dialog hidden"><div class="modal"><b>使い方と注意</b><p>初回は▶を押してカメラアクセスを許可してください。白い丸で撮影し、左のサムネイルで写真を開きます。写真は端末のダウンロードに保存されます。</p><p>カメラ利用には通常HTTPSまたはlocalhostが必要です。SafariでローカルHTMLを直接開いた場合は動作しないことがあります。ズームはデジタル方式です。</p><p>アプリは撮影音を再生しませんが、OSや地域仕様の強制音を制御できません。</p><button id="closeHelp">閉じる</button></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),video=$('video'),frame=$('frame'),toast=$('toast');let stream=null,front=false,ratio='4:3',timer=0,zoom=1,filter='normal',lastUrl=null,busy=false,clearToast=null;const filters={normal:'none',vivid:'saturate(1.6) contrast(1.1)',mono:'grayscale(1)',warm:'sepia(.28) saturate(1.3)',cool:'hue-rotate(15deg) saturate(.93)',retro:'sepia(.55) contrast(.9) saturate(.8)'};function message(s){toast.textContent=s;toast.classList.remove('hidden');clearTimeout(clearToast);clearToast=setTimeout(()=>toast.classList.add('hidden'),3500)}function applyRatio(){frame.style.aspectRatio=ratio==='4:3'?'3 / 4':ratio==='1:1'?'1 / 1':'9 / 16';frame.style.height='auto';frame.style.maxHeight='100%';frame.style.width='auto';frame.style.maxWidth='100%';const vw=$('video').videoWidth||3,vh=$('video').videoHeight||4;const parent=frame.parentElement;let r=ratio==='4:3'?3/4:ratio==='1:1'?1:9/16;const pw=parent.clientWidth,ph=parent.clientHeight;frame.style.width=Math.min(pw,ph*r)+'px';frame.style.height=Math.min(ph,pw/r)+'px'}function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}async function start(){if(!navigator.mediaDevices?.getUserMedia){message('カメラ非対応です。HTTPSで公開したURLをSafari/Chromeで開いてください。');return}stop();try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:front?'user':'environment'},width:{ideal:1920},height:{ideal:1440}}});video.srcObject=stream;await video.play();$('shutter').disabled=false;message('撮影できます');$('startBtn')?.remove();video.addEventListener('loadedmetadata',applyRatio,{once:true});applyRatio()}catch(e){message('カメラを起動できません: '+(e.name==='NotAllowedError'?'設定からカメラを許可してください':e.message));$('shutter').disabled=true}}function renderPhoto(){if(!video.videoWidth)throw Error('カメラ映像が準備できていません');const sw=video.videoWidth,sh=video.videoHeight,r=ratio==='4:3'?3/4:ratio==='1:1'?1:9/16;let w,h;if(sw/sh>r){h=sh;w=h*r}else{w=sw;h=w/r}const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));const ctx=c.getContext('2d');ctx.filter=filters[filter];ctx.translate(c.width/2,c.height/2);if(front)ctx.scale(-1,1);ctx.scale(zoom,zoom);ctx.drawImage(video,(sw-w)/2,(sh-h)/2,w,h,-c.width/2,-c.height/2,c.width,c.height);return c}function save(canvas){canvas.toBlob(blob=>{if(!blob){message('保存できませんでした');return}if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(blob);const slot=$('previewSlot');slot.innerHTML='';const a=document.createElement('a');a.href=lastUrl;a.download='camera-'+new Date().toISOString().replace(/[:.]/g,'-')+'.jpg';a.title='撮影した写真を保存';const img=document.createElement('img');img.className='last';img.alt='最後の写真';img.src=lastUrl;a.appendChild(img);slot.appendChild(a);a.click();message('撮影しました。保存されない場合は左の画像をタップしてください。')},'image/jpeg',.94)}async function capture(){if(busy||!stream)return;busy=true;$('shutter').disabled=true;try{for(let i=timer;i>=1;i--){$('countdown').textContent=i;$('countdown').classList.remove('hidden');await new Promise(resolve=>setTimeout(resolve,1000));if(!stream)throw Error('カメラが停止しました')}$('countdown').classList.add('hidden');save(renderPhoto());frame.animate([{opacity:1},{opacity:.35},{opacity:1}],{duration:220})}catch(e){message(e.message)}finally{$('countdown').classList.add('hidden');busy=false;$('shutter').disabled=!stream}}$('startBtn').addEventListener('click',start);$('shutter').addEventListener('click',capture);$('flipBtn').addEventListener('click',async()=>{front=!front;await start()});$('ratioBtn').addEventListener('click',()=>{ratio=ratio==='4:3'?'1:1':ratio==='1:1'?'16:9':'4:3';$('ratioBtn').textContent=ratio;applyRatio()});$('timerBtn').addEventListener('click',()=>{timer=timer===0?3:timer===3?10:0;$('timerBtn').textContent='◷ '+(timer?timer+'秒':'OFF');$('timerBtn').classList.toggle('active',!!timer)});$('gridBtn').addEventListener('click',()=>{$('grid').classList.toggle('hidden');$('gridBtn').classList.toggle('active')});$('zoom').addEventListener('input',e=>{zoom=Number(e.target.value);$('zoomText').textContent=zoom.toFixed(1)+'×';video.style.setProperty('--zoom',zoom)});$('filters').addEventListener('click',e=>{const btn=e.target.closest('[data-filter]');if(!btn)return;filter=btn.dataset.filter;video.style.setProperty('--filter',filters[filter]);document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('selected',b===btn))});$('helpBtn').addEventListener('click',()=>$('dialog').classList.remove('hidden'));$('closeHelp').addEventListener('click',()=>$('dialog').classList.add('hidden'));document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(!$('startBtn'))message('カメラが停止しました。切り替えボタン⟳で再開できます')});window.addEventListener('resize',applyRatio);applyRatio()})();
</script></body></html>
